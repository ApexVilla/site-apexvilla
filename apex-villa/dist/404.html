<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05050A" />
  <title>Página não encontrada | ApexVilla</title>
  <!-- noindex: página de erro não deve entrar no índice do Google. -->
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/images/logo-1.1.png" />
  <style>
    @font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:400 700;font-display:swap;src:url('/fonts/cormorant-normal.woff2') format('woff2')}
    @font-face{font-family:'DM Sans';font-style:normal;font-weight:300 700;font-display:swap;src:url('/fonts/dmsans.woff2') format('woff2')}
    :root{--bg1:#0A1F1C;--gold:#D4AF37;--gold-light:#F3E5AB;--text:#F0F5F3;--text-secondary:#A3B8B2;--gold-border:rgba(212,175,55,.15)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
      font-family:'DM Sans',-apple-system,sans-serif;color:var(--text);background:var(--bg1);
      background-image:linear-gradient(rgba(212,175,55,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.025) 1px,transparent 1px);
      background-size:60px 60px;-webkit-font-smoothing:antialiased;text-align:center}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:620px}
    .logo{height:56px;margin:0 auto 40px;display:block}
    .code{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(4.5rem,14vw,8rem);font-weight:600;line-height:1;color:var(--gold);letter-spacing:-.02em}
    h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(1.6rem,4vw,2.4rem);font-weight:600;margin:8px 0 18px}
    p{color:var(--text-secondary);line-height:1.7;margin-bottom:36px}
    .links{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 30px;border-radius:2px;font-size:.92rem;font-weight:600;
      background:linear-gradient(135deg,var(--gold-light) 0%,var(--gold) 50%,#b38e24 100%);color:var(--bg1)}
    .btn-ghost{background:none;border:1px solid var(--gold-border);color:var(--gold);font-weight:500}
    .btn-ghost:hover{border-color:var(--gold)}
    .alt{margin-top:34px;font-size:.85rem;color:var(--text-secondary)}
    .alt a{color:var(--gold);border-bottom:1px solid var(--gold-border)}
  </style>
</head>

<body>
  <main class="wrap">
    <img src="/images/logo-1.1.png" alt="ApexVilla" class="logo" width="56" height="56">
    <div class="code">404</div>
    <h1>Esta página não existe.</h1>
    <p>O endereço pode ter mudado ou o link estar quebrado. Mas o que você procura provavelmente está aqui embaixo.</p>
    <div class="links">
      <a class="btn" href="/">Ir para a página inicial</a>
      <a class="btn btn-ghost" href="/#contact">Falar com a ApexVilla</a>
    </div>
    <p class="alt">
      <a href="/criacao-de-sites/">Criação de Sites</a> ·
      <a href="/desenvolvimento-de-aplicativos/">Desenvolvimento de Aplicativos</a> ·
      <a href="/sistemas-sob-medida/">Sistemas Sob Medida</a> ·
      <a href="/es/">Español</a>
    </p>
  </main>
</body>

</html>
